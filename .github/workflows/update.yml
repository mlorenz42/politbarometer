name: Daten aktualisieren

# Nur Datenabruf + Build + Commit. Das Veröffentlichen auf GitHub Pages übernimmt deploy.yml, getriggert
# durch den Push auf docs/** unten – so lösen reine Vorlagen-/Stil-Änderungen (src/**), bei denen die
# Rohdaten schon lokal gebaut mitgeschickt werden, keinen unnötigen Neuabruf aller Quellen aus.
on:
  schedule:
    - cron: "23 5 * * 1" # jeden Montag, 05:23 UTC
  workflow_dispatch: # manuell startbar (Actions-Tab > "Run workflow")
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write # die Action committet geänderte Daten zurück ins Repo

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      regierung: ${{ steps.regierung.outcome }}
      landtage: ${{ steps.landtage.outcome }}
      landesregierungen: ${{ steps.landesregierungen.outcome }}
      sitze: ${{ steps.sitze.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Politbarometer von wahlrecht.de abrufen
        run: python scripts/update_data.py

      # Die folgenden drei Schritte dürfen fehlschlagen (Quelle umgebaut, Quellen widersprechen sich,
      # neue Partei, ...). Dann bleiben die bisherigen Daten stehen, alles andere wird trotzdem
      # veröffentlicht, und der Job "daten-fehler" unten schlägt absichtlich fehl, damit GitHub eine
      # Fehlermail schickt.
      - name: Bundesregierung aus Wikipedia abrufen
        id: regierung
        continue-on-error: true
        run: python scripts/update_regierungen.py

      - name: Landtagsumfragen von wahlrecht.de abrufen
        id: landtage
        continue-on-error: true
        run: python scripts/update_landtage.py

      - name: Landesregierungen aus Wikipedia abrufen
        id: landesregierungen
        continue-on-error: true
        run: python scripts/update_landesregierungen.py

      # Braucht aktuelle Regierungsdaten (die beiden Schritte oben) zum Gegenprüfen, läuft deshalb danach.
      - name: Sitzverteilung aus Wikipedia abrufen
        id: sitze
        continue-on-error: true
        run: python scripts/update_sitze.py

      - name: Seiten bauen
        run: python scripts/build_site.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Daten aktualisiert ($(date -u +%F))"
            git push
          fi

  daten-fehler:
    needs: build
    if: needs.build.outputs.regierung == 'failure' || needs.build.outputs.landtage == 'failure' || needs.build.outputs.landesregierungen == 'failure' || needs.build.outputs.sitze == 'failure'
    runs-on: ubuntu-latest
    steps:
      - env:
          REGIERUNG: ${{ needs.build.outputs.regierung }}
          LANDTAGE: ${{ needs.build.outputs.landtage }}
          LANDESREGIERUNGEN: ${{ needs.build.outputs.landesregierungen }}
          SITZE: ${{ needs.build.outputs.sitze }}
        run: |
          echo "::error::Nicht alle Daten konnten aktualisiert werden (Bundesregierung: $REGIERUNG, Landtagsumfragen: $LANDTAGE, Landesregierungen: $LANDESREGIERUNGEN, Sitzverteilung: $SITZE). Details stehen in den Schritten des Jobs 'build'. Veröffentlicht wurde mit den zuletzt gültigen Daten."
          exit 1
