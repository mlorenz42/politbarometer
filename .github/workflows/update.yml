name: Daten aktualisieren und Seiten veröffentlichen

on:
  schedule:
    - cron: "23 5 2,17 * *" # am 2. und 17. jedes Monats, 05:23 UTC
  workflow_dispatch: # manuell startbar (Actions-Tab > "Run workflow")
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write # die Action committet geänderte Daten zurück ins Repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      regierung: ${{ steps.regierung.outcome }}
      landtage: ${{ steps.landtage.outcome }}
      landesregierungen: ${{ steps.landesregierungen.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Politbarometer von wahlrecht.de abrufen
        run: python scripts/update_data.py

      # Die folgenden drei Schritte dürfen fehlschlagen (Quelle umgebaut, Quellen widersprechen sich,
      # neue Partei, ...). Dann bleiben die bisherigen Daten stehen, alles andere wird trotzdem
      # veröffentlicht, und der Job "daten-fehler" unten schlägt absichtlich fehl, damit GitHub eine
      # Fehlermail schickt.
      - name: Bundesregierung aus Wikipedia abrufen
        id: regierung
        continue-on-error: true
        run: python scripts/update_regierungen.py

      - name: Landtagsumfragen von wahlrecht.de abrufen
        id: landtage
        continue-on-error: true
        run: python scripts/update_landtage.py

      - name: Landesregierungen aus Wikipedia abrufen
        id: landesregierungen
        continue-on-error: true
        run: python scripts/update_landesregierungen.py

      - name: Seiten bauen
        run: python scripts/build_site.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Daten aktualisiert ($(date -u +%F))"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  daten-fehler:
    needs: build
    if: needs.build.outputs.regierung == 'failure' || needs.build.outputs.landtage == 'failure' || needs.build.outputs.landesregierungen == 'failure'
    runs-on: ubuntu-latest
    steps:
      - env:
          REGIERUNG: ${{ needs.build.outputs.regierung }}
          LANDTAGE: ${{ needs.build.outputs.landtage }}
          LANDESREGIERUNGEN: ${{ needs.build.outputs.landesregierungen }}
        run: |
          echo "::error::Nicht alle Daten konnten aktualisiert werden (Bundesregierung: $REGIERUNG, Landtagsumfragen: $LANDTAGE, Landesregierungen: $LANDESREGIERUNGEN). Details stehen in den Schritten des Jobs 'build'. Veröffentlicht wurde mit den zuletzt gültigen Daten."
          exit 1
