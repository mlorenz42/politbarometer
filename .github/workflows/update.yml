name: Daten aktualisieren und Seite veröffentlichen

on:
  schedule:
    - cron: "23 5 2 * *" # am 2. jedes Monats, 05:23 UTC
  workflow_dispatch: # manuell startbar (Actions-Tab > "Run workflow")
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write # die Action committet geänderte Daten zurück ins Repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      regierung: ${{ steps.regierung.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Umfragedaten von wahlrecht.de abrufen
        run: python scripts/update_data.py

      # Schlägt dieser Schritt fehl (Wikipedia umgebaut, Quellen widersprechen sich, neue Partei),
      # werden die Umfragedaten trotzdem veröffentlicht; der Job "regierung-fehler" unten schlägt dann
      # absichtlich fehl, damit GitHub dir eine Fehlermail schickt.
      - name: Regierungsdaten aus Wikipedia abrufen
        id: regierung
        continue-on-error: true
        run: python scripts/update_regierungen.py

      - name: Seite bauen
        run: python scripts/build_site.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Daten aktualisiert ($(date -u +%F))"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  regierung-fehler:
    needs: build
    if: needs.build.outputs.regierung == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Die Regierungsdaten konnten nicht aktualisiert werden (Details im Schritt 'Regierungsdaten aus Wikipedia abrufen' des Jobs 'build'). Die Umfragedaten wurden trotzdem veröffentlicht."
          exit 1
