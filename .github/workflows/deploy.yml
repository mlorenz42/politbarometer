name: Seiten veröffentlichen

# Reines Deployment auf GitHub Pages. Zwei Auslöser:
# - push auf docs/** für lokal fertig gebaute und gepushte Commits (z. B. nach manuellen Änderungen).
# - workflow_run für den "Änderungen committen"-Schritt in update.yml: der pusht mit dem automatischen
#   GITHUB_TOKEN, und solche Pushes lösen laut GitHub bewusst KEINE weiteren Workflows aus (Schutz vor
#   Endlosschleifen) – ohne diesen zweiten Trigger wäre der wöchentliche/freitägliche Datenabruf also nie
#   tatsächlich veröffentlicht worden, nur committet.
# Ruft dafür keine externen Quellen ab und braucht deshalb nur einen Bruchteil von dessen Laufzeit.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_run:
    workflows: ["Daten aktualisieren"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
